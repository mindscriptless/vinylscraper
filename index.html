<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinylscraper</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:#111;color:#eee;padding:12px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0 10px}button,.btn{background:#1db954;color:#000;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600}
button.sec{background:#2a2a2a;color:#eee}button.big{width:100%;padding:18px;font-size:18px}
input{width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#eee;font-size:16px}
details,.card{background:#1a1a1a;border-radius:12px;padding:12px;margin:10px 0}summary{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{font-size:13px;color:#aaa}
#status{min-height:22px;margin:8px 0;color:#9be}.err{color:#f88!important}
.cand{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;border:2px solid transparent}.cand.sel{border-color:#1db954}
.cand img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#333}
.price{font-size:20px;font-weight:700}
.tr{padding:9px 6px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between}.tr.cur{background:#1db95433;border-radius:6px}
a{color:#7cf}
</style></head><body>
<h1>Vinylscraper</h1>
<details id="set"><summary>Einstellungen</summary>
<p class="small">Redirect-URI für Spotify: <b id="redir"></b></p>
<label>Spotify Client ID<input id="cid" autocomplete="off"></label>
<label>Gemini API Key<input id="gem" type="password" autocomplete="off"></label>
<label>Discogs Token<input id="dis" type="password" autocomplete="off"></label>
<label>Gemini Modell<input id="model"></label>
<div class="row"><label>Intro (s)<input id="t1" type="number"></label><label>Sprung bei (s)<input id="jump" type="number"></label><label>Dauer (s)<input id="len" type="number"></label></div>
<div class="row"><button id="save">Speichern</button><button class="sec" id="login">Bei Spotify anmelden</button></div>
<p class="small" id="auth"></p></details>
<button class="big" id="scan">📷 Rückseite fotografieren</button>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<div class="row" style="margin-top:8px"><input id="manual" placeholder="oder manuell: Artist - Album" style="flex:3"><button class="sec" id="mgo" style="flex:1">Suche</button></div>
<div id="status"></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=Object.assign({cid:'',gem:'',dis:'',model:'gemini-flash-latest',t1:5,jump:120,len:10},JSON.parse(localStorage.getItem('lp')||'{}'));
const REDIR=location.origin+location.pathname;
const status=(m,e)=>{const s=$('#status');s.textContent=m;s.className=e?'err':''};
function fill(){for(const k of ['cid','gem','dis','model','t1','jump','len'])$('#'+k).value=cfg[k];$('#redir').textContent=REDIR;
 $('#auth').textContent=localStorage.getItem('lpt')?'Spotify: angemeldet':'Spotify: nicht angemeldet'}
$('#save').onclick=()=>{for(const k of ['cid','gem','dis','model'])cfg[k]=$('#'+k).value.trim();for(const k of ['t1','jump','len'])cfg[k]=Number($('#'+k).value)||cfg[k];
 localStorage.setItem('lp',JSON.stringify(cfg));status('Gespeichert.')};
$('#login').onclick=()=>{$('#save').click();login()};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
 if(!cfg.cid){status('Bitte Spotify Client ID eintragen.',1);return}
 const v=b64u(crypto.getRandomValues(new Uint8Array(48)));localStorage.setItem('lpv',v);
 const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 const p=new URLSearchParams({client_id:cfg.cid,response_type:'code',redirect_uri:REDIR,scope:'user-read-playback-state user-modify-playback-state',code_challenge_method:'S256',code_challenge:ch});
 location.href='https://accounts.spotify.com/authorize?'+p;
}
async function tokenReq(body){
 const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
 const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error);
 const old=JSON.parse(localStorage.getItem('lpt')||'{}');
 const n={access:j.access_token,refresh:j.refresh_token||old.refresh,exp:Date.now()+j.expires_in*1000-60000};
 localStorage.setItem('lpt',JSON.stringify(n));return n;
}
async function token(){
 let t=JSON.parse(localStorage.getItem('lpt')||'null');if(!t)throw new Error('Nicht bei Spotify angemeldet (Einstellungen).');
 if(Date.now()>t.exp)t=await tokenReq({client_id:cfg.cid,grant_type:'refresh_token',refresh_token:t.refresh});
 return t.access;
}
async function sp(path,opt={}){
 const r=await fetch('https://api.spotify.com/v1'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'}}));
 const txt=await r.text();let j={};try{j=JSON.parse(txt)}catch(e){}
 if(!r.ok)throw new Error('Spotify '+r.status+': '+((j.error&&j.error.message)||txt));
 return j;
}
async function dg(path,params={}){
 const u=new URL('https://api.discogs.com'+path);
 Object.entries(params).forEach(([k,v])=>{if(v)u.searchParams.set(k,v)});u.searchParams.set('token',cfg.dis);
 const r=await fetch(u);if(!r.ok)throw new Error('Discogs '+r.status);return r.json();
}
function toB64(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 res(c.toDataURL('image/jpeg',.85).split(',')[1]);URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function readCover(b64){
 const prompt='Das Foto zeigt die Rückseite (oder Vorderseite) einer Schallplatte oder Maxi-Single. Lies Artist, Albumtitel, Label, Katalognummer (z.B. "2302 055"), Jahr und die Tracklist. Ignoriere Preisaufkleber und Händlernummern. Antworte NUR als JSON: {"artist":"","album":"","label":"","catno":"","year":"","tracks":[""],"confidence":0.0}. Unbekannte Felder leer lassen.';
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+cfg.model+':generateContent?key='+encodeURIComponent(cfg.gem),
  {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'image/jpeg',data:b64}},{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
 const j=await r.json();if(!r.ok)throw new Error('Gemini '+r.status+': '+((j.error&&j.error.message)||'')+(r.status==429?' (Limit erreicht, manuell suchen)':''));
 const t=j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/^```json|```$/g,'').trim();
 return JSON.parse(t);
}
async function findDiscogs(m){
 const tries=[];
 if(m.catno)tries.push({catno:m.catno,artist:m.artist});
 if(m.catno)tries.push({catno:m.catno});
 if(m.artist&&m.album)tries.push({artist:m.artist,release_title:m.album});
 tries.push({q:[m.artist,m.album].filter(Boolean).join(' ')});
 for(const t of tries){const j=await dg('/database/search',Object.assign({type:'release',per_page:8},t));if(j.results&&j.results.length)return j.results}
 return [];
}
async function getPrice(id){
 const o={};
 try{const s=await dg('/marketplace/stats/'+id,{curr_abbr:'EUR'});o.low=s.lowest_price;o.n=s.num_for_sale}catch(e){o.err=e.message}
 try{const p=await dg('/marketplace/price_suggestions/'+id);o.vg=p['Very Good Plus (VG+)']}catch(e){}
 return o;
}
const eur=p=>p&&p.value!=null?new Intl.NumberFormat('de-DE',{style:'currency',currency:p.currency||'EUR'}).format(p.value):'–';
const norm=s=>(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9äöüß ]/g,' ').replace(/\s+/g,' ').trim();
async function findSpotify(artist,album){
 let best=null,bs=0;
 for(const q of ['album:'+album+' artist:'+artist,album+' '+artist]){
  const j=await sp('/search?type=album&limit=10&q='+encodeURIComponent(q));
  for(const a of (j.albums&&j.albums.items)||[]){
   let s=0;const n=norm(a.name),w=norm(album);
   if(n===w)s+=3;else if(n.includes(w)||w.includes(n))s+=2;
   if(a.artists.some(x=>norm(x.name)===norm(artist)||norm(artist).includes(norm(x.name))))s+=2;
   if(a.album_type==='album')s+=.5;
   if(s>bs){bs=s;best=a}
  }
  if(bs>=4)break;
 }
 if(!best||bs<3)return null;
 const full=await sp('/albums/'+best.id);
 return {id:best.id,name:full.name,artist:full.artists.map(x=>x.name).join(', '),img:(full.images[0]||{}).url,tracks:full.tracks.items.map(t=>({name:t.name,uri:t.uri,dur:t.duration_ms,n:t.track_number,d:t.disc_number}))};
}
let run=0,cur=-1,tracks=[],devId=null;
const sleepUntil=(ms,id)=>new Promise(r=>{const end=Date.now()+ms;const iv=setInterval(()=>{if(run!==id||Date.now()>=end){clearInterval(iv);r()}},100)});
async function getDevice(force){
 if(devId&&!force)return devId;
 const j=await sp('/me/player/devices');const d=j.devices||[];
 const a=d.find(x=>x.is_active)||d.find(x=>x.type==='Smartphone')||d[0];
 if(!a)throw new Error('Kein Spotify-Gerät gefunden. Spotify-App öffnen, kurz einen Titel starten, dann nochmal.');
 devId=a.id;return devId;
}
async function playAt(uri,pos){
 for(let i=0;i<2;i++){
  try{const d=await getDevice(i>0);await sp('/me/player/play?device_id='+d,{method:'PUT',body:JSON.stringify({uris:[uri],position_ms:Math.max(0,Math.floor(pos))})});return}
  catch(e){devId=null;if(i)throw e}
 }
}
function mark(){document.querySelectorAll('.tr').forEach((e,i)=>e.classList.toggle('cur',i===cur))}
async function startFrom(i){
 run++;const id=run;
 for(cur=i;cur<tracks.length;cur++){
  if(run!==id)return;mark();
  const t=tracks[cur];
  try{
   await playAt(t.uri,0);await sleepUntil(cfg.t1*1000,id);if(run!==id)return;
   const pos=t.dur>(cfg.jump+cfg.len)*1000+3000?cfg.jump*1000:Math.floor(t.dur*.5);
   await playAt(t.uri,pos);await sleepUntil(cfg.len*1000,id);
  }catch(e){status(e.message,1);return}
 }
 if(run===id){try{await sp('/me/player/pause',{method:'PUT'})}catch(e){}status('Album durch.')}
}
async function stop(){run++;try{await sp('/me/player/pause',{method:'PUT'})}catch(e){}}
function render(meta,cands,spot,price,sel){
 const q=encodeURIComponent((meta.artist||'')+' '+(meta.album||''));
 let h='<div class="card"><b>'+esc(meta.artist)+' – '+esc(meta.album)+'</b><div class="small">'+esc([meta.label,meta.catno,meta.year].filter(Boolean).join(' · '))+'</div></div>';
 if(price){h+='<div class="card"><div class="small">Discogs (günstigstes Angebot, kein Durchschnitt)</div><div class="price">ab '+eur(price.low)+'</div><div class="small">'+(price.n!=null?price.n+' im Angebot':'')+(price.vg?' · Preisvorschlag VG+: '+eur(price.vg):'')+(price.err&&!price.low?' · '+esc(price.err):'')+'</div></div>'}
 if(cands.length){h+='<div class="card"><div class="small">Discogs-Treffer (antippen = Preis dieser Pressung)</div>';
  cands.slice(0,5).forEach((c,i)=>{h+='<div class="cand'+(i===sel?' sel':'')+'" data-i="'+i+'"><img src="'+esc(c.thumb)+'"><div>'+esc(c.title)+'<div class="small">'+esc([c.year,c.country,(c.label||[]).slice(0,1).join(),c.catno].filter(Boolean).join(' · '))+'</div></div></div>'});h+='</div>'}
 if(spot){h+='<div class="card"><div class="row"><button class="sec" id="prev">⏮</button><button class="sec" id="stop">⏸</button><button id="next">⏭ Nächster Titel</button></div><div style="margin-top:8px">';
  spot.tracks.forEach((t,i)=>{h+='<div class="tr" data-i="'+i+'"><span>'+(i+1)+'. '+esc(t.name)+'</span><span class="small">'+Math.floor(t.dur/60000)+':'+String(Math.floor(t.dur/1000)%60).padStart(2,'0')+'</span></div>'});h+='</div></div>'}
 else h+='<div class="card">Nicht auf Spotify gefunden. <a target="_blank" href="https://listen.tidal.com/search?q='+q+'">Tidal</a> · <a target="_blank" href="https://www.youtube.com/results?search_query='+q+'+full+album">YouTube</a></div>';
 $('#out').innerHTML=h;
 document.querySelectorAll('.cand').forEach(e=>e.onclick=async()=>{const i=+e.dataset.i;status('Preis wird geladen…');const p=await getPrice(cands[i].id);status('');render(meta,cands,spot,p,i)});
 document.querySelectorAll('.tr').forEach(e=>e.onclick=()=>startFrom(+e.dataset.i));
 if(spot){$('#next').onclick=()=>startFrom(Math.min(cur+1,tracks.length-1));$('#prev').onclick=()=>startFrom(Math.max(cur-1,0));$('#stop').onclick=stop;mark()}
}
async function process(meta){
 if(!meta.artist&&!meta.album&&!meta.catno){status('Nichts erkannt. Nochmal fotografieren oder manuell eingeben.',1);return}
 run++;status('Suche auf Discogs und Spotify…');
 const [d,s]=await Promise.allSettled([findDiscogs(meta),findSpotify(meta.artist||'',meta.album||'')]);
 const cands=d.status==='fulfilled'?d.value:[];const spot=s.status==='fulfilled'?s.value:null;
 let price=null;if(cands.length)price=await getPrice(cands[0].id);
 tracks=spot?spot.tracks:[];cur=-1;render(meta,cands,spot,price,0);
 const errs=[d,s].filter(x=>x.status==='rejected').map(x=>x.reason.message);
 status(errs.join(' | '),errs.length>0);
 if(spot&&tracks.length){if(!errs.length)status('Spiele '+spot.name);startFrom(0)}
}
$('#scan').onclick=()=>{if(!cfg.gem){status('Gemini Key fehlt (Einstellungen). Manuell suchen geht trotzdem.',1);$('#set').open=true;return}$('#file').click()};
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
 try{status('Lese Foto…');const meta=await readCover(await toB64(f));status('Erkannt: '+(meta.artist||'?')+' – '+(meta.album||'?'));await process(meta)}catch(err){status(err.message,1)}};
$('#mgo').onclick=async()=>{const v=$('#manual').value.trim();if(!v)return;const p=v.split(/\s+[-–]\s+/);
 try{await process({artist:p[0],album:p.slice(1).join(' - ')||p[0]})}catch(err){status(err.message,1)}};
(async()=>{fill();
 const q=new URLSearchParams(location.search);
 if(q.get('code')){try{await tokenReq({client_id:cfg.cid,grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,code_verifier:localStorage.getItem('lpv')});history.replaceState({},'',REDIR);fill();status('Spotify verbunden.')}catch(e){status(e.message,1)}}
 else if(q.get('error'))status('Spotify: '+q.get('error'),1);
 if(!cfg.cid||!cfg.dis||!localStorage.getItem('lpt'))$('#set').open=true;
})();
</script></body></html>
