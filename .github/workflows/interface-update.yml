name: Integrate interface update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/interface-update.yml', 'refinements.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update and verify index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const ov=(m,e)=>','let ov=(m,e)=>')
          tag='<script src="refinements.js?v=20261012-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          node --check refinements.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Integrate interface and fix mutable status binding"; git push; fi
