name: Integrate history tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/history-update.yml', 'history-tools.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate history extension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          assert 'patch-batch.js' in s, 'Bugfix batch must be integrated first'
          s=re.sub(r'<script src="history-tools\.js[^"\n]*"></script>\s*','',s)
          s=s.replace('</body>','<script src="history-tools.js?v=20261012-4"></script>\n</body>')
          p.write_text(s)
          PY
          node --check history-tools.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Integrate history tools"; git push; fi
