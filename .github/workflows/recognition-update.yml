name: Integrate recognition tools
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recognition-update.yml', 'recognition-tools.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate recognition extension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          assert 'patch-batch.js' in s
          s=re.sub(r'<script src="recognition-tools\.js[^"\n]*"></script>\s*','',s)
          s=s.replace('</body>','<script src="recognition-tools.js?v=20261012-5"></script>\n</body>')
          p.write_text(s)
          PY
          node --check recognition-tools.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Integrate catalogue and no-match recognition"; git push; fi
