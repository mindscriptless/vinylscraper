name: Integrate player controls and six-cover previews
on:
  push:
    branches: [main]
    paths: ['player-covers-update.js', '.github/workflows/player-covers-update.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing integration and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tracklist-upgrade.js')
          s=p.read_text()
          s=s.replace('visible=9','visible=6').replace('visible+=9','visible+=6').replace('.slice(0,9)', '.slice(0,6)').replace('next nine','next six')
          marker='function controls(){'
          hooks="window.vinylEarlyCoverProgress=d=>{showGrid(d);moreBusy=true;addMore()};window.vinylEndCoverProgress=()=>{moreBusy=false;addMore()};\n"
          if 'window.vinylEarlyCoverProgress=' not in s:
              assert s.count(marker)==1
              s=s.replace(marker,hooks+marker,1)
          old='key})}}s.page=page}'
          new="key})}if(page===1&&s.pool.size){window.vinylEarlyCoverProgress(distinct([...s.pool.values()].sort((a,b)=>b.votes-a.votes)));ov('Preliminary tracklist candidates — checking matches…');}}s.page=page}"
          if old in s:
              assert s.count(old)==1
              s=s.replace(old,new,1)
          else:
              assert new in s
          s=s.replace("busy=false;controls()}}}","busy=false;moreBusy=false;controls();addMore()}}}")
          p.write_text(s)
          for name,marker in [('photo-hints.js','function cats(text){'),('recognition-tools.js','function catalogues(text){')]:
              p=Path(name)
              s=p.read_text()
              insertion="const assisted=window.vinylCatalogueCandidates?.(text)||[];if(assisted.length)return assisted;"
              if marker+insertion not in s:
                  assert s.count(marker)==1
                  s=s.replace(marker,marker+insertion,1)
              p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          assert 'photo-hints.js' in s and '</body>' in s
          for name in ['tracklist-upgrade','photo-hints','recognition-tools']:
              s=re.sub(re.escape(name)+r'\.js(?:\?[^"\n]*)?',name+'.js?v=20261012-27',s)
          s=re.sub(r'<script src="player-covers-update\.js[^"\n]*"></script>\s*','',s)
          s=s.replace('</body>','<script src="player-covers-update.js?v=20261012-27"></script>\n</body>')
          p.write_text(s)
          PY
          node --check player-covers-update.js
          node --check tracklist-upgrade.js
          node --check photo-hints.js
          node --check recognition-tools.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tracklist-upgrade.js photo-hints.js recognition-tools.js
          if ! git diff --cached --quiet; then git commit -m "Integrate progressive six-cover previews and catalogue OCR fixes"; git push; fi
